name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - macos-26-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checkers
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install shellcheck actionlint lychee

      - name: Run repository tests
        run: ./scripts/test.sh

      - name: Check zsh syntax
        run: zsh -n dotfiles/zsh/zprofile dotfiles/zsh/zshenv dotfiles/zsh/zshrc

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Check local Markdown links
        run: lychee --offline --include-fragments --no-progress '**/*.md'
